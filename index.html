<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='20' text-anchor='middle' fill='%23d0312d'%3ER%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1c1c1e;
    --muted: #5c5c62;
    --quiet: #a3a3a3;
    --line: #dddde1;
    --hover: #f2f2f4;
    --press: #ebebee;
    --accent: #2b7ab5;
    --pivot: #d0312d;
  }
  :root.dark {
    --bg: #161513;
    --ink: #ece8e1;
    --muted: #a8a29a;
    --quiet: #77736c;
    --line: #3a3833;
    --hover: #24231f;
    --press: #2b2a26;
    --accent: #5aa9e0;
    --pivot: #ff5a4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  /* The stage: the whole screen, one word in the middle. */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    cursor: default;
  }
  #word {
    display: grid; grid-template-columns: 1fr auto 1fr;
    width: 100%;
    white-space: nowrap;
    font-weight: 400;
    line-height: 1.2;
  }
  #word .l { text-align: right; overflow: visible; }
  #word .p { color: var(--pivot); }
  #word .r { text-align: left; overflow: visible; }
  #box { position: relative; width: 100%; }
  /* Two faint ticks mark where the red letter lands, so the eye can park there. */
  #ticks { position: absolute; left: 50%; top: 50%; pointer-events: none; }
  #ticks::before, #ticks::after {
    content: ""; position: absolute; left: -0.5px; width: 1px; height: var(--tick, 14px);
    background: var(--line);
  }
  #ticks::before { bottom: var(--gap, 50px); }
  #ticks::after { top: var(--gap, 50px); }
  .empty #word { cursor: pointer; }

  #msg {
    position: absolute; left: 0; right: 0; top: calc(50% + var(--gap, 50px) + 24px);
    text-align: center; color: var(--muted); font-size: 13px; pointer-events: none;
  }

  /* The menu. Sits at the bottom so the word stays visible above it. */
  #menu {
    touch-action: none;
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(380px, 100vw);
    padding: 18px 22px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg);
    border: 1px solid var(--line); border-bottom: 0;
    display: none;
  }
  #menu.open { display: block; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
  .row:first-child { margin-top: 0; }
  .row h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .info { color: var(--muted); font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 28px; margin: 2px 0 0; background: transparent; cursor: pointer;
    touch-action: none;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px;
    border-radius: 50%; background: var(--quiet); border: 0;
  }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--quiet); border: 0; }
  /* The dial is grey at rest and turns black while it's being moved. */
  /* Each slider has its own colour (speed green, size red, position blue), so the edge of vision can
     tell which one is under the finger or mouse without looking (Mark 11-26). */
  #wpm { --dial: #0fb300; } #size { --dial: #cc0a16; } #pos { --dial: #0070e6; }
  :root.dark #wpm { --dial: #2ad417; } :root.dark #size { --dial: #f2333e; } :root.dark #pos { --dial: #2a8ef7; }
  input[type=range].moving::-webkit-slider-thumb { background: var(--dial); }
  input[type=range].moving::-moz-range-thumb { background: var(--dial); }
  /* With a mouse it also takes its colour on hover, before the wheel moves it.
     Not on a phone, where a tap leaves hover stuck. */
  :root:not(.touch) input[type=range]:hover::-webkit-slider-thumb { background: var(--dial); }
  :root:not(.touch) input[type=range]:hover::-moz-range-thumb { background: var(--dial); }
  input[type=range]:focus { outline: none; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin: -8px -12px 8px; }
  .nav button { font-size: 34px; line-height: 1; width: 76px; height: 56px; }
  .nav #play { padding: 0; flex: 1; width: auto; }   /* fills the space between the arrows */
  .nav #play svg { display: block; margin: auto; width: 18px; height: 20px; fill: currentColor; }
  /* Pressed state: a light grey fill shows the instant you press and fades straight away. */
  /* Kept very faint and rounded so it registers at the edge of vision without pulling the eye off the word. */
  .nav button.flash { animation: flash 280ms ease-out; border-radius: 10px; }
  @keyframes flash { from { background: var(--press); } to { background: transparent; } }

  /* Right-click menu (double tap on a phone): Open file and Dark/Light. */
  #ctx {
    position: fixed; z-index: 5; min-width: 150px; padding: 4px 0;
    background: var(--bg); border: 1px solid var(--line); display: none;
  }
  #ctx.open { display: block; }
  #ctx button { display: block; width: 100%; text-align: left; padding: 8px 16px; color: var(--ink); }
  #ctx button:hover { text-decoration: none; background: var(--hover); }

  button {
    font: inherit; color: var(--quiet); background: none; border: 0;
    padding: 8px 10px; cursor: pointer; min-height: 40px;
  }
  button:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .nav button:hover { text-decoration: none; background: var(--hover); }
  /* After a press the button goes quiet again: no fill, no colour, until the mouse leaves.
     On a phone the hover look never shows (taps leave it stuck). */
  button.pressed:hover, .touch button:hover { color: var(--quiet); text-decoration: none; background: none; }
  button:focus { outline: none; }
  button:focus-visible { outline: 1px solid var(--line); }

  #drop {
    position: fixed; inset: 12px; border: 1px dashed var(--quiet); display: none; pointer-events: none;
  }
  .dragging #drop { display: block; }
  #file { display: none; }
</style>
</head>
<body class="empty">

<div id="stage">
  <div id="box">
    <div id="word"><span class="l"></span><span class="p"></span><span class="r"></span></div>
    <div id="ticks"></div>
    <div id="msg"></div>
  </div>
</div>
<div id="drop"></div>

<div id="menu" role="dialog" aria-label="Menu">
  <div class="nav">
    <button id="back" title="Previous sentence, Left arrow" aria-label="Previous sentence">&lsaquo;</button>
    <button id="play" title="Space" aria-label="Play"></button>
    <button id="fwd" title="Next sentence, Right arrow" aria-label="Next sentence">&rsaquo;</button>
  </div>

  <div class="row"><h3>SPEED</h3><span><b id="wpmVal">150</b> wpm</span></div>
  <input type="range" id="wpm" min="60" max="250" step="5" value="150" aria-label="Speed">

  <div class="row"><h3>SIZE</h3><span><b id="sizeVal">52</b> px</span></div>
  <input type="range" id="size" min="40" max="65" step="1" value="52" aria-label="Size">

  <div class="row"><h3>POSITION</h3><span class="info" id="where"></span></div>
  <input type="range" id="pos" min="0" max="0" step="1" value="0" aria-label="Position">
</div>

<div id="ctx" role="menu">
  <button id="open" role="menuitem">Open file</button>
  <button id="theme" role="menuitem">Dark</button>
</div>

<input type="file" id="file" accept=".pdf,.docx,.txt,.md,.text,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain">

<script>
'use strict';

/* ---------- Settings and storage ---------- */

const SETTINGS_KEY = 'reader.settings';
// Speed range: 60 wpm (a young reader, 1 s per word) to 250 wpm (a relaxed adult reader).
const MIN_WPM = 60, MAX_WPM = 250;
// Soft start: after play or a jump, reading starts at half speed and eases up evenly to full speed
// over 1.5 seconds, the same at every speed (Mark 11-26, was 3 s).
const RAMP_MS = 1500;
const defaults = { wpm: 150, size: null, dark: false };
let settings = Object.assign({}, defaults, readJSON(SETTINGS_KEY));
settings.wpm = Math.min(MAX_WPM, Math.max(MIN_WPM, +settings.wpm || defaults.wpm));

function readJSON(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; } }
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }

// The open document is kept in IndexedDB so a reload or a visit tomorrow comes back to it.
// The file itself never leaves the device.
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('reader', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const r = db.transaction('kv').objectStore('kv').get(k);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error);
    });
  }
};

/* ---------- Document state ---------- */

// doc = { id, name, words: [], breaks: Uint8Array (1 = sentence end, 2 = paragraph end), pages: [start index per page] | null }
let doc = null;
let idx = 0;
let sentenceStarts = [];

function posKey() { return 'reader.pos.' + doc.id; }
function savePos() { if (doc) try { localStorage.setItem(posKey(), String(idx)); } catch (e) {} }

/* ---------- Text into words ---------- */

const SENT_END = /[.!?…]["'”’)\]]*$/;
const DASH = /^[-–—―]+$/;
const ABBREV = /^(mr|mrs|ms|dr|prof|sr|jr|st|vs|etc|e\.g|i\.e|no|fig|vol|approx|inc|ltd|co|mt)\.$/i;

// paragraphs: array of strings. pageOf: optional array giving the page number of each paragraph.
function buildDoc(name, paragraphs, pageOf) {
  const words = [], breaks = [], pages = pageOf ? [] : null;
  const first = [];
  let rawCount = 0;
  const letters = w => w.replace(/[^\p{L}\p{N}]/gu, '').toLowerCase();
  paragraphs.forEach((p, pi) => {
    // Long hyphenated words ("happy-for-other-people") are shown in pieces, each keeping its hyphen.
    const raw = p.split(/\s+/).filter(Boolean)
      .flatMap(w => w.length > 13 && /\p{L}-\p{L}/u.test(w) ? w.split(/(?<=\p{L}-)(?=\p{L})/u) : [w]);
    rawCount += raw.length;
    first.push(...raw.slice(0, 50 - first.length));
    // A doubled word ("Nai Nai", "very very") shows as one screen. Not across a comma or full stop.
    // A dash standing on its own (- – — --) goes with the word before it ("said —").
    const parts = [];
    raw.forEach(w => {
      const prev = parts[parts.length - 1];
      if (prev && DASH.test(w)) parts[parts.length - 1] = prev + ' ' + w;
      else if (prev && !prev.includes(' ') && /[\p{L}\p{N}]$/u.test(prev) && letters(prev) && letters(prev) === letters(w)) parts[parts.length - 1] = prev + ' ' + w;
      else parts.push(w);
    });
    // A paragraph that opens with a dash has no word before it: the dash goes with the next word.
    if (parts.length > 1 && DASH.test(parts[0])) parts.splice(0, 2, parts[0] + ' ' + parts[1]);
    if (!parts.length) return;
    if (pages) { const pg = pageOf[pi]; while (pages.length <= pg) pages.push(words.length); }
    parts.forEach(w => {
      words.push(w);
      breaks.push(SENT_END.test(w) && !ABBREV.test(w) && !/^[A-Z]\.$/.test(w) ? 1 : 0);
    });
    breaks[breaks.length - 1] = 2;
  });
  // The id uses the words as split before joining, so places saved before 11-26 still match.
  return { id: hash(name + '|' + rawCount + '|' + first.join(' ')), name, words, breaks, pages };
}

function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}

function computeSentences() {
  sentenceStarts = [0];
  for (let i = 0; i < doc.words.length - 1; i++) if (doc.breaks[i]) sentenceStarts.push(i + 1);
}

// Plain text: blank lines split paragraphs; single line breaks inside a paragraph are just spaces.
// Lines that are only a number (page numbers in pasted text) are dropped.
function textToParagraphs(text) {
  text = text.replace(/\r\n?/g, '\n').replace(/­/g, '').replace(/(\w)-\n(\w)/g, '$1$2');
  return text.split(/\n\s*\n/)
    .map(p => p.split('\n').filter(l => !/^\s*\d{1,4}\s*$/.test(l)).join(' ').trim())
    .filter(Boolean);
}

/* ---------- File readers ---------- */

const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
const MAMMOTH = 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = res; s.onerror = () => rej(new Error('Could not load the file reader. Check the connection.'));
    document.head.appendChild(s);
  });
}

async function readPdf(file) {
  const pdfjs = await import(PDFJS + 'pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs';
  const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const paragraphs = [], pageOf = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    showMsg('Reading page ' + n + ' of ' + pdf.numPages);
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    // Rebuild lines from the text items, using their vertical position.
    const lines = [];
    let cur = null;
    for (const it of tc.items) {
      if (!('str' in it)) continue;
      const y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 10;
      if (!cur || Math.abs(cur.y - y) > h * 0.5) {
        if (cur) lines.push(cur);
        cur = { y, h, text: '' };
      }
      cur.text += it.str;
      if (it.hasEOL) { lines.push(cur); cur = null; }
    }
    if (cur) lines.push(cur);
    const clean = lines.map(l => ({ ...l, text: l.text.replace(/\s+/g, ' ').trim() })).filter(l => l.text);
    // Drop page numbers ("12", "Page 12", "12 of 40") at the top or bottom of the page.
    const isPageNo = t => /^(page\s*)?\d{1,4}(\s*(of|\/)\s*\d{1,4})?$/i.test(t) || /^[-–]\s*\d{1,4}\s*[-–]$/.test(t);
    while (clean.length && isPageNo(clean[clean.length - 1].text)) clean.pop();
    while (clean.length && isPageNo(clean[0].text)) clean.shift();
    // A paragraph ends where the gap to the next line is clearly bigger than normal line spacing.
    const gaps = [];
    for (let i = 1; i < clean.length; i++) gaps.push(clean[i - 1].y - clean[i].y);
    const sorted = gaps.filter(g => g > 0).sort((a, b) => a - b);
    const normal = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0;
    let para = '';
    clean.forEach((l, i) => {
      if (/-$/.test(para) && /^[a-z]/.test(l.text)) para = para.slice(0, -1) + l.text;
      else para += (para ? ' ' : '') + l.text;
      const gap = i < gaps.length ? gaps[i] : Infinity;
      if (gap > normal * 1.4 || gap < 0) { paragraphs.push(para); pageOf.push(n - 1); para = ''; }
    });
    if (para) { paragraphs.push(para); pageOf.push(n - 1); }
  }
  return { paragraphs, pageOf, numPages: pdf.numPages };
}

async function readDocx(file) {
  if (!window.mammoth) await loadScript(MAMMOTH);
  const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  return r.value.split(/\n+/).map(s => s.trim()).filter(Boolean);
}

async function openFile(file) {
  if (!file) return;
  pause();
  closeMenu();
  const name = file.name;
  const ext = (name.split('.').pop() || '').toLowerCase();
  try {
    showMsg('Opening ' + name);
    let d;
    if (ext === 'pdf' || file.type === 'application/pdf') {
      const r = await readPdf(file);
      d = buildDoc(name, r.paragraphs, r.pageOf);
      if (d.pages) while (d.pages.length < r.numPages) d.pages.push(d.words.length);
    } else if (ext === 'docx') {
      d = buildDoc(name, await readDocx(file));
    } else if (ext === 'doc') {
      throw new Error('Old .doc files can’t be read. Save it as .docx in Word first.');
    } else {
      d = buildDoc(name, textToParagraphs(await file.text()));
    }
    if (!d.words.length) {
      throw new Error(ext === 'pdf'
        ? 'No text found. This PDF is probably a scan (pictures of pages).'
        : 'No text found in this file.');
    }
    setDoc(d, Number(localStorage.getItem('reader.pos.' + d.id)) || 0);
    showMsg('');
    idb.set('doc', { ...d, breaks: Array.from(d.breaks) }).catch(() => {});
    try { localStorage.setItem('reader.lastDoc', d.id); } catch (e) {}
  } catch (e) {
    showMsg(e.message || 'Could not open that file.');
  }
}

// A book saved on the device keeps the word splits from the day it was opened. On load it is
// split again with today's rules (doubled words, dashes), and the saved place is carried across.
function refreshStored(d, start) {
  const paras = [], pageOf = d.pages ? [] : null;
  let cur = [], first = 0, pg = 0;
  d.words.forEach((w, i) => {
    cur.push(w);
    if (d.breaks[i] === 2 || i === d.words.length - 1) {
      if (pageOf) { while (pg < d.pages.length - 1 && d.pages[pg + 1] <= first) pg++; pageOf.push(pg); }
      paras.push(cur.join(' ')); cur = []; first = i + 1;
    }
  });
  const n = buildDoc(d.name, paras, pageOf);
  n.id = d.id;
  if (n.words.length === d.words.length) return { d, start };
  if (n.pages) while (n.pages.length < d.pages.length) n.pages.push(n.words.length);
  // Old place -> new place: count the single words before it, then find the screen that holds that word.
  const count = w => w.split(' ').length;
  let r = 0; for (let i = 0; i < start; i++) r += count(d.words[i]);
  let j = 0, acc = 0; while (j < n.words.length - 1 && acc + count(n.words[j]) <= r) acc += count(n.words[j++]);
  idb.set('doc', { ...n, breaks: Array.from(n.breaks) }).catch(() => {});
  try { localStorage.setItem('reader.pos.' + n.id, String(j)); } catch (e) {}
  return { d: n, start: j };
}

function setDoc(d, start) {
  doc = d;
  doc.breaks = Uint8Array.from(d.breaks);
  computeSentences();
  idx = Math.min(Math.max(0, start), doc.words.length - 1);
  pos.max = doc.words.length - 1;
  document.body.classList.remove('empty');
  render();
}

/* ---------- Showing a word ---------- */

const wordEl = document.getElementById('word');
const [lEl, pEl, rEl] = wordEl.children;
const msgEl = document.getElementById('msg');

// Where the eye should land: a little left of the middle (Spritz-style recognition point).
function pivotIndex(core) {
  const n = core.length;
  if (n <= 1) return 0;
  if (n <= 5) return 1;
  if (n <= 9) return 2;
  if (n <= 13) return 3;
  return 4;
}

function showWord(w) {
  // Leading quotes and brackets don't count when finding the middle letter.
  // Work in whole characters so emoji and accented letters stay in one piece.
  const chars = Array.from(w.replace(/ /g, ' ')); // keep the space in "Nai Nai" visible
  const isAlnum = c => /[\p{L}\p{N}]/u.test(c);
  const lead = chars.findIndex(isAlnum);
  const core = lead < 0 ? [] : chars.slice(lead, chars.length - [...chars].reverse().findIndex(isAlnum));
  let p = core.length ? lead + pivotIndex(core) : Math.floor((chars.length - 1) / 2);
  // Never put the red mark on a comma or dot inside a number like 1,250.
  if (core.length) while (p < chars.length - 1 && !isAlnum(chars[p])) p++;
  lEl.textContent = chars.slice(0, p).join('');
  pEl.textContent = chars[p] || '';
  rEl.textContent = chars.slice(p + 1).join('');
  fitWord();
}

// Word size: 40 to 65 px. Without a saved size, it picks one to suit the screen within that range.
const MIN_SIZE = 40, MAX_SIZE = 65;
function baseSize() {
  const s = settings.size || Math.round(Math.min(window.innerWidth / 9, window.innerHeight / 5));
  return Math.min(MAX_SIZE, Math.max(MIN_SIZE, s));
}

// A long word on a narrow phone gets shrunk just enough to fit, then the size goes back.
function fitWord() {
  const size = baseSize();
  wordEl.style.fontSize = size + 'px';
  const textWidth = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
  const half = Math.max(textWidth(lEl), textWidth(rEl)) + pEl.offsetWidth / 2;
  const room = window.innerWidth * 0.47;
  if (half > room) wordEl.style.fontSize = Math.floor(size * room / half) + 'px';
  document.documentElement.style.setProperty('--gap', Math.round(size * 0.85) + 'px');
  document.documentElement.style.setProperty('--tick', Math.round(size * 0.22) + 'px');
}

function render() {
  if (!doc) { showWord('Open'); return; }
  showWord(doc.words[idx]);
  updateMenu();
}

function showMsg(t) { msgEl.textContent = t; }

/* ---------- Playback ---------- */

let playing = false, timer = null, rampAt = 0, saveCount = 0, due = 0;

// Each word is timed against the clock, so small timer delays don't add up and slow the reading.
// If the phone stalls for a moment, start fresh instead of rushing through the missed words.
function schedule(ms) { const now = performance.now(); due = (due && playing && now - due < 100 ? due : now) + ms; timer = setTimeout(step, Math.max(0, due - performance.now())); }
function restart() { clearTimeout(timer); due = 0; schedule(delayFor(idx)); }

// How long a word stays up. Longer for sentence ends, commas and long words.
function delayFor(i) {
  const w = doc.words[i];
  let m = 1;
  const len = w.replace(/[^\p{L}\p{N}]/gu, '').length;
  if (len > 8) m += (len - 8) * 0.06;
  if (len > 14) m += 0.2;
  if (/\d/.test(w)) m += 0.3;
  if (w.includes(' ') && !/ [-–—―]+$/.test(w)) m += 0.6; // a doubled word is two words on one screen
  // Commas and dashes get no pause. A full stop and the end of a paragraph get the same short one (Mark 11-26).
  if (doc.breaks[i]) m += 0.5;
  // Soft start (see RAMP_MS): a word shown at the start is held twice as long; halfway through, 1.5 times.
  if (rampAt) {
    const t = (performance.now() - rampAt) / RAMP_MS;
    if (t < 1) m *= 2 - t; else rampAt = 0;
  }
  return 60000 / settings.wpm * m;
}

function step() {
  if (!playing) return;
  if (idx >= doc.words.length - 1) { pause(); showMsg('End'); return; }
  idx++;
  render();
  if (++saveCount % 20 === 0) savePos();
  schedule(delayFor(idx));
}

function play() {
  if (!doc || playing) return;
  if (idx >= doc.words.length - 1) idx = 0;
  showMsg('');
  playing = true; rampAt = performance.now();
  render();
  restart();
  wakeLock(true);
  updateMenu();
}

function pause() {
  if (!playing) return;
  playing = false;
  clearTimeout(timer);
  savePos();
  wakeLock(false);
  updateMenu();
}

function toggle() { playing ? pause() : play(); }

// Keep a phone screen awake while reading.
let lock = null;
async function wakeLock(on) {
  try {
    if (on && 'wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); }
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) {}
}

/* ---------- Jumping ---------- */

function sentenceIndex() {
  let lo = 0, hi = sentenceStarts.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (sentenceStarts[mid] <= idx) lo = mid; else hi = mid - 1; }
  return lo;
}

function jump(dir) {
  if (!doc) return;
  const s = sentenceIndex();
  if (dir < 0) {
    // First tap goes back to the start of this sentence; if already there, to the one before.
    idx = (idx - sentenceStarts[s] > 1 || s === 0) ? sentenceStarts[s] : sentenceStarts[s - 1];
  } else {
    idx = s < sentenceStarts.length - 1 ? sentenceStarts[s + 1] : doc.words.length - 1;
  }
  rampAt = performance.now();
  showMsg('');
  render();
  savePos();
  if (playing) restart();
}

/* ---------- Menu ---------- */

const menu = document.getElementById('menu');
const wpm = document.getElementById('wpm'), wpmVal = document.getElementById('wpmVal');
const size = document.getElementById('size'), sizeVal = document.getElementById('sizeVal');
const pos = document.getElementById('pos'), where = document.getElementById('where');
const playBtn = document.getElementById('play'), themeBtn = document.getElementById('theme');
let draggingPos = false;
const ICON_PLAY = '<svg viewBox="0 0 18 20" aria-hidden="true"><path d="M2 1.5v17L17 10z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 18 20" aria-hidden="true"><rect x="3" y="2" width="4" height="16"/><rect x="11" y="2" width="4" height="16"/></svg>';

// The menu never stops the reading: words keep going above it while you change settings.
function openMenu() {
  menu.classList.add('open');
  updateMenu();
  // Lift the word so it sits in the space above the menu.
  stage.style.bottom = menu.offsetHeight + 'px';
}
function closeMenu() {
  if (!menu.classList.contains('open')) return;
  menu.classList.remove('open');
  stage.style.bottom = '';
}
function menuOpen() { return menu.classList.contains('open'); }

function minutesLeft() {
  const left = doc.words.length - 1 - idx;
  return Math.max(0, Math.ceil(left / settings.wpm * 1.25));   // 1.25 allows for the pauses at full stops
}

function updateMenu() {
  wpm.value = settings.wpm; wpmVal.textContent = settings.wpm;
  size.value = baseSize(); sizeVal.textContent = baseSize();
  themeBtn.textContent = settings.dark ? 'Light' : 'Dark';
  if (playBtn.dataset.state !== String(playing)) {
    playBtn.dataset.state = playing;
    playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }
  if (!doc) { where.textContent = 'No file open'; pos.disabled = true; return; }
  pos.disabled = false;
  if (!draggingPos) pos.value = idx;
  let at;
  if (doc.pages && doc.pages.length > 1) {
    let pg = 0; while (pg < doc.pages.length - 1 && doc.pages[pg + 1] <= idx) pg++;
    at = 'Page ' + (pg + 1) + ' of ' + doc.pages.length;
  } else {
    at = Math.round(idx / Math.max(1, doc.words.length - 1) * 100) + '%';
  }
  const m = minutesLeft();
  where.textContent = at + ' · ' + (m < 60 ? m + ' min left' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min left');
}

wpm.addEventListener('input', () => { settings.wpm = +wpm.value; saveSettings(); updateMenu(); });
size.addEventListener('input', () => { settings.size = +size.value; saveSettings(); render(); updateMenu(); });
pos.addEventListener('input', () => {
  if (!doc) return;
  idx = +pos.value; rampAt = performance.now(); showMsg(''); render();
  if (playing) restart();
});
// Touch: a slider works like a trackpad, so it can be used by feel while the eyes stay on the word.
// Where the finger lands doesn't matter and a tap does nothing; sliding moves the dial by the same
// distance from wherever it already is. A mouse keeps the normal behaviour (click a spot to jump there).
document.querySelectorAll('#menu input[type=range]').forEach(r => {
  r.addEventListener('touchstart', e => e.preventDefault(), { passive: false });   // stops the native jump-to-finger
  let drag = null;
  r.addEventListener('pointerdown', e => {
    r.classList.add('moving');
    const done = () => { r.classList.remove('moving'); window.removeEventListener('pointerup', done); window.removeEventListener('pointercancel', done); };
    window.addEventListener('pointerup', done); window.addEventListener('pointercancel', done);
    if (e.pointerType === 'mouse') return;
    drag = { id: e.pointerId, x: e.clientX, v: +r.value };
    try { r.setPointerCapture(e.pointerId); } catch (err) {}
  });
  r.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const span = +r.max - +r.min, travel = r.getBoundingClientRect().width - 14;   // 14 = knob width
    if (span <= 0 || travel <= 0) return;
    const before = r.value;
    r.value = Math.min(+r.max, Math.max(+r.min, drag.v + (e.clientX - drag.x) / travel * span));
    if (r.value !== before) r.dispatchEvent(new Event('input', { bubbles: true }));
  });
  const end = e => { if (drag && e.pointerId === drag.id) { drag = null; r.dispatchEvent(new Event('change', { bubbles: true })); } };
  r.addEventListener('pointerup', end);
  r.addEventListener('pointercancel', end);
});

// While a finger or mouse is on the position slider, the reading doesn't pull the knob away from it.
pos.addEventListener('pointerdown', () => { draggingPos = true; });
['pointerup', 'pointercancel', 'change'].forEach(t => pos.addEventListener(t, () => { draggingPos = false; savePos(); }));
playBtn.addEventListener('click', toggle);
document.getElementById('open').addEventListener('click', () => { closeCtx(); fileInput.click(); });
themeBtn.addEventListener('click', () => { closeCtx(); settings.dark = !settings.dark; saveSettings(); applyTheme(); updateMenu(); });

// The small right-click menu opens where the click or double tap was, kept inside the screen.
const ctx = document.getElementById('ctx');
function openCtx(x, y) {
  updateMenu();
  ctx.classList.add('open');
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = Math.max(4, Math.min(x, window.innerWidth - w - 4)) + 'px';
  ctx.style.top = Math.max(4, Math.min(y, window.innerHeight - h - 4)) + 'px';
}
function closeCtx() { ctx.classList.remove('open'); }
function ctxOpen() { return ctx.classList.contains('open'); }

// On a phone the arrows and Play flash grey when tapped (restarted on every tap, so quick taps each show).
// A mouse already gets the hover fill, so it gets no flash.
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
}));

// Arrows: tap for one sentence, hold to keep jumping.
['back', 'fwd'].forEach(id => {
  const b = document.getElementById(id), dir = id === 'back' ? -1 : 1;
  let hold = null, rep = null;
  const stop = () => { clearTimeout(hold); clearInterval(rep); hold = rep = null; };
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    jump(dir);
    hold = setTimeout(() => { rep = setInterval(() => jump(dir), 120); }, 400);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, stop));
  b.addEventListener('click', e => e.preventDefault());
  b.addEventListener('contextmenu', e => e.preventDefault());
});

function applyTheme() {
  document.documentElement.classList.toggle('dark', settings.dark);
  document.querySelector('meta[name=theme-color]').content = settings.dark ? '#161513' : '#ffffff';
}

/* ---------- Input: mouse, touch, keyboard, drag and drop ---------- */

const stage = document.getElementById('stage');
const fileInput = document.getElementById('file');
fileInput.addEventListener('change', () => { openFile(fileInput.files[0]); fileInput.value = ''; });

// Computer: left click plays or pauses, right click opens the small menu (Open file, Dark),
// G opens and closes the settings menu, the mouse wheel over a slider moves it.
// Phone: a tap plays or pauses, a double tap opens the small menu, swipe up opens the settings
// menu, swipe down anywhere (sliders and buttons too) closes it.
// A tap or click outside the menus always plays or pauses, so the settings menu can stay up while reading.
// While the small menu is open, a click or tap outside it only closes it.
function primary() { if (!doc) fileInput.click(); else toggle(); }

let swallow = false, downIdx = 0;
document.addEventListener('pointerdown', e => {
  swallow = false;
  downIdx = idx;   // taken before an arrow jumps, so a swipe down can undo the jump
  if (ctxOpen() && !e.target.closest('#ctx')) { closeCtx(); swallow = true; }
}, true);

// On a computer a click only plays or pauses; it never opens a file (right-click > Open file, or O).
stage.addEventListener('pointerup', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0 || swallow) return;
  if (doc) toggle();
});

let touchStart = null, lastTap = null;
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  const slider = e.target.closest('input[type=range]');
  touchStart = {
    x: e.clientX, y: e.clientY, onStage: !!e.target.closest('#stage'),
    // Remembered so a swipe down that starts on a slider or arrow can undo what that touch changed.
    slider, value: slider && slider.value, idx: downIdx, arrow: !!e.target.closest('#back, #fwd')
  };
});
document.addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse' || !touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y, s = touchStart;
  touchStart = null;
  if (swallow) return;
  if (Math.abs(dy) >= 40 && Math.abs(dy) > Math.abs(dx)) {
    if (dy < 0 && !menuOpen() && !s.slider) openMenu();
    else if (dy > 0 && menuOpen()) {
      if (s.slider && s.slider.value !== s.value) { s.slider.value = s.value; s.slider.dispatchEvent(new Event('input')); }
      if (s.arrow && doc) { idx = s.idx; render(); savePos(); if (playing) restart(); }
      closeMenu();
    }
    return;
  }
  if (!s.onStage || Math.abs(dx) >= 12 || Math.abs(dy) >= 12) return;
  const now = performance.now();
  if (doc && lastTap && now - lastTap.t < 450 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 60) {
    lastTap = null;
    toggle();   // undo the first tap's play or pause
    openCtx(e.clientX, e.clientY);
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  primary();
});
document.addEventListener('pointercancel', () => { touchStart = null; });

// Mouse wheel over a slider moves it one step per notch: speed 5 wpm, size 1 px, position one sentence.
// Wheel up = more / forward. The dial shows black while it moves, like a drag.
let wheelAcc = 0, wheelEl = null;
document.querySelectorAll('#menu input[type=range]').forEach(r => r.addEventListener('wheel', e => {
  e.preventDefault();
  if (r.disabled) return;
  if (wheelEl !== r) { wheelEl = r; wheelAcc = 0; }
  wheelAcc += e.deltaMode ? e.deltaY * 34 : e.deltaY;   // line mode (Firefox): ~3 lines per notch
  while (Math.abs(wheelAcc) >= 100) {
    const dir = wheelAcc < 0 ? 1 : -1;
    wheelAcc += dir * 100;
    if (r === pos) jump(dir);
    else {
      const before = r.value;
      dir > 0 ? r.stepUp() : r.stepDown();
      if (r.value !== before) r.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
  r.classList.add('moving');
  clearTimeout(r.wheelIdle);
  r.wheelIdle = setTimeout(() => r.classList.remove('moving'), 400);
}, { passive: false }));

// Buttons drop their hover and focus look once pressed, so nothing lingers on them.
document.addEventListener('pointerdown', e => {
  document.documentElement.classList.toggle('touch', e.pointerType !== 'mouse');
}, true);
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button');
  if (!b || !e.detail) return; // e.detail is 0 for keyboard presses: those keep focus
  b.blur();
  b.classList.add('pressed');
  b.addEventListener('pointerleave', () => b.classList.remove('pressed'), { once: true });
});

document.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (e.target.closest && e.target.closest('#menu, #ctx')) return;
  // Phones fire contextmenu on a long press; ignore it so it never opens a menu by accident.
  if (e.pointerType === 'touch' || (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents)) return;
  openCtx(e.clientX, e.clientY);
});

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  // A focused button or slider keeps its own keys.
  if ((k === ' ' || k === 'Enter') && e.target.closest && e.target.closest('button')) return;
  if (k.startsWith('Arrow') && e.target.matches && e.target.matches('input[type=range]')) return;
  // Space, Enter and D play or pause; S and F jump back and forward a sentence, like the arrow keys.
  if (k === ' ' || k === 'Enter' || k === 'd' || k === 'D') { e.preventDefault(); if (doc) toggle(); }
  else if (k === 'ArrowLeft' || k === 's' || k === 'S') { e.preventDefault(); jump(-1); }
  else if (k === 'ArrowRight' || k === 'f' || k === 'F') { e.preventDefault(); jump(1); }
  else if (k === 'ArrowUp') { e.preventDefault(); settings.wpm = Math.min(MAX_WPM, settings.wpm + 5); saveSettings(); updateMenu(); }
  else if (k === 'ArrowDown') { e.preventDefault(); settings.wpm = Math.max(MIN_WPM, settings.wpm - 5); saveSettings(); updateMenu(); }
  else if (k === 'Escape') { if (ctxOpen()) closeCtx(); else if (menuOpen()) closeMenu(); }
  else if (k === 'g' || k === 'G') { menuOpen() ? closeMenu() : openMenu(); }   // next to S D F (was M)
  else if (k === 'o' || k === 'O') { fileInput.click(); }
});

let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});

// Save the place when the tab is hidden or closed, and stop reading in the background.
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); savePos(); });
window.addEventListener('pagehide', savePos);
window.addEventListener('resize', () => { if (doc || document.body.classList.contains('empty')) fitWord(); updateMenu(); });

/* ---------- Start ---------- */

applyTheme();
render();
(async () => {
  const last = localStorage.getItem('reader.lastDoc');
  if (!last) return;
  try {
    const d = await idb.get('doc');
    if (d && d.id === last) {
      const f = refreshStored(d, Number(localStorage.getItem('reader.pos.' + d.id)) || 0);
      setDoc(f.d, f.start);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
